# Serves the built dashboard and proxies everything the browser needs from the
# API. Without this, /api requests from the container hit nginx itself and 404,
# which is why the compose deployment could not talk to the backend.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PDF previews and resume downloads stream through the API.
    client_max_body_size 25m;

    # Docker's embedded DNS. Resolving at request time rather than in an upstream
    # block means nginx starts even when the API container is not up yet, instead
    # of refusing to boot with "host not found in upstream".
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # "api" is the service name in docker/docker-compose.yml. Held in a
        # variable so the name is resolved per request.
        set $api_backend "http://api:8000";
        proxy_pass $api_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Role discovery and job imports call a model, which is slower than the
        # 60s nginx default.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Submission evidence: screenshots and recorded runs.
    location ~ ^/(evidence|videos)/ {
        set $api_backend "http://api:8000";
        proxy_pass $api_backend$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single page app: every other path resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
