<!DOCTYPE html>
<html>
<head>
  <title>Greenhouse Test Job Application</title>
</head>
<body>
  <div id="application_form">
    <h2>Apply for XR Engineer at TestCompany</h2>
    <form id="application-form" action="/submit" method="POST">
      <div>
        <label for="first_name">First Name *</label>
        <input type="text" id="first_name" name="first_name" required />
      </div>
      <div>
        <label for="last_name">Last Name *</label>
        <input type="text" id="last_name" name="last_name" required />
      </div>
      <div>
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div>
        <label for="phone">Phone *</label>
        <input type="tel" id="phone" name="phone" required />
      </div>
      <div>
        <label for="resume">Resume / CV *</label>
        <input type="file" id="resume" name="resume" required />
      </div>
      <div class="field">
        <label>Are you legally authorized to work in Spain / European Union? *</label>
        <select name="auth_eu">
          <option value="">Select...</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>
      <button type="button" id="submit_app" onclick="document.body.innerHTML = '<h1>Thank you for applying</h1><p>Application received</p>'">
        Submit Application
      </button>
    </form>
  </div>
</body>
</html>
