<!DOCTYPE html>
<html>
<head>
  <title>Generic Career Portal</title>
</head>
<body>
  <form id="generic-application">
    <h2>Apply for Software Engineer</h2>
    <div>
      <label for="fname">First Name</label>
      <input type="text" id="fname" placeholder="First Name" />
    </div>
    <div>
      <label for="lname">Last Name</label>
      <input type="text" id="lname" placeholder="Last Name" />
    </div>
    <div>
      <label for="uemail">Email</label>
      <input type="email" id="uemail" placeholder="Email" />
    </div>
    <div>
      <label for="uphone">Phone</label>
      <input type="tel" id="uphone" placeholder="Phone" />
    </div>
    <div>
      <label for="uresume">Upload Resume</label>
      <input type="file" id="uresume" />
    </div>
    <button type="button" onclick="document.body.innerHTML = '<h2>Application received</h2><p>Submission successful</p>'">
      Send Application
    </button>
  </form>
</body>
</html>
