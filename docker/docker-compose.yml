services:
  db:
    image: postgres:16-alpine
    container_name: jobagent_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: jobagent
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobagent"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: jobagent_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: jobagent_api
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ..:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/jobagent
      - DATABASE_URL_SYNC=postgresql://postgres:postgrespassword@db:5432/jobagent
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: jobagent_worker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ../.env
    volumes:
      - ..:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/jobagent
      - DATABASE_URL_SYNC=postgresql://postgres:postgrespassword@db:5432/jobagent
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: jobagent_web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
